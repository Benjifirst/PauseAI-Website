<!doctype html>
<html lang="de-AT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vorschau · Titelschrift</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
<style>
  /* Nur für diese Vorschau. Datei und Ordner fonts/vorschau gehören nicht zur Website. */
  @font-face { font-family: 'Jost'; font-weight: 300; src: url('fonts/vorschau/Jost-Light.ttf') format('truetype'); }
  @font-face { font-family: 'Jost'; font-weight: 400; src: url('fonts/vorschau/Jost-Regular.ttf') format('truetype'); }
  @font-face { font-family: 'Josefin Sans'; font-weight: 300; src: url('fonts/vorschau/JosefinSans-Light.ttf') format('truetype'); }
  @font-face { font-family: 'Josefin Sans'; font-weight: 400; src: url('fonts/vorschau/JosefinSans-Regular.ttf') format('truetype'); }
  @font-face { font-family: 'Marcellus'; font-weight: 400; src: url('fonts/vorschau/Marcellus-Regular.ttf') format('truetype'); }
  @font-face { font-family: 'Cormorant Garamond'; font-weight: 400; src: url('fonts/vorschau/CormorantGaramond-Regular.ttf') format('truetype'); }
  @font-face { font-family: 'Cormorant Garamond'; font-weight: 500; src: url('fonts/vorschau/CormorantGaramond-Medium.ttf') format('truetype'); }
  @font-face { font-family: 'Instrument Serif'; font-weight: 400; src: url('fonts/vorschau/InstrumentSerif-Regular.ttf') format('truetype'); }

  /* Ein Muster je Schrift. --title wird je Muster überschrieben, dadurch greifen die echten Regeln der Seite. */
  .spec { --w: 400; --k: 1; --ls: .06em; padding: 28px 0 44px; border-top: 1px solid var(--ink); }
  .spec-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; margin-bottom: 28px; }
  .spec-head .label { flex: none; }
  .spec-head .what { font-size: 14px; color: var(--muted); margin-right: auto; }
  .spec-head .weights { display: flex; gap: 8px; }
  .spec .brand-name { font-weight: var(--w); }
  .spec .big {
    font: 400 calc(clamp(44px, 8vw, 76px) * var(--k))/1.04 var(--title);
    font-weight: var(--w); letter-spacing: var(--ls); margin: 28px 0 16px;
  }
  .spec .big em { font-style: normal; border-bottom: 2px solid var(--gold); }
  .spec .lead { font-size: 18px; max-width: 54ch; margin: 0 0 32px; }
  .spec .display {
    font-size: calc(clamp(30px, 4.6vw, 44px) * var(--k));
    font-weight: var(--w); letter-spacing: calc(var(--ls) * .66);
  }
</style>
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <a class="brand" href="index.html" aria-label="PauseAI Österreich, Startseite">
      <span class="brand-name">PAUSEAI <b>AT</b></span>
      <span class="flag" aria-hidden="true"></span>
    </a>
    <a class="brand-mark" href="index.html" aria-label="Zur Startseite"><img src="assets/logo.svg" alt="" width="30" height="30"></a>
  </div>
</header>

<main class="page">
  <div class="wrap">
    <a class="button quiet small back" href="index.html">← Zurück zur Startseite</a>
    <p class="kicker">Vorschau</p>
    <h1>Titelschrift</h1>
    <p class="lead-in">Die jetzige Schrift und fünf mögliche Nachfolger, jeweils mit Wortmarke, großer Überschrift, Fließtext und einer Abschnittszeile von der Startseite. Zeichenabstand und Größe sind je Schrift leicht angepasst, so wie beim Einbau auch.</p>
    <div id="specs"></div>
  </div>
</main>

<script>
(function () {
  'use strict';

  var FONTS = [
    { name: 'Jetzt: Poiret One', what: 'die aktuelle Titelschrift, zum Vergleich',
      family: "'Poiret One', sans-serif", ls: '.06em', k: 1, weights: [[400, 'Normal']] },
    { name: 'Jost', what: 'geometrisch, klar, 1920er ohne Zierrat',
      family: "'Jost', sans-serif", ls: '.02em', k: 1, weights: [[300, 'Leicht'], [400, 'Normal']] },
    { name: 'Josefin Sans', what: 'geometrisch, schmal, noch leicht verspielt',
      family: "'Josefin Sans', sans-serif", ls: '.02em', k: 1, weights: [[300, 'Leicht'], [400, 'Normal']] },
    { name: 'Marcellus', what: 'klassisch, wie von einer Inschrift',
      family: "'Marcellus', serif", ls: '.02em', k: 0.95, weights: [[400, 'Normal']] },
    { name: 'Cormorant Garamond', what: 'feine Serifenschrift, literarisch',
      family: "'Cormorant Garamond', serif", ls: '0em', k: 1.1, weights: [[500, 'Kräftiger'], [400, 'Normal']] },
    { name: 'Instrument Serif', what: 'moderne, schmale Serifenschrift',
      family: "'Instrument Serif', serif", ls: '0em', k: 1.08, weights: [[400, 'Normal']] }
  ];

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  var host = document.getElementById('specs');

  FONTS.forEach(function (f) {
    var spec = el('section', 'spec');
    spec.style.setProperty('--title', f.family);
    spec.style.setProperty('--ls', f.ls);
    spec.style.setProperty('--k', f.k);
    spec.style.setProperty('--w', f.weights[0][0]);

    var head = el('div', 'spec-head');
    head.appendChild(el('span', 'label', f.name));
    head.appendChild(el('span', 'what', f.what));
    if (f.weights.length > 1) {
      var group = el('span', 'weights');
      f.weights.forEach(function (w, i) {
        var b = el('button', 'button small' + (i === 0 ? ' primary' : ''), w[1]);
        b.type = 'button';
        b.setAttribute('aria-pressed', i === 0 ? 'true' : 'false');
        b.addEventListener('click', function () {
          spec.style.setProperty('--w', w[0]);
          group.querySelectorAll('button').forEach(function (o) {
            o.classList.toggle('primary', o === b);
            o.setAttribute('aria-pressed', o === b ? 'true' : 'false');
          });
        });
        group.appendChild(b);
      });
      head.appendChild(group);
    }
    spec.appendChild(head);

    var brand = el('div', 'brand');
    var name = el('span', 'brand-name');
    name.appendChild(document.createTextNode('PAUSEAI '));
    name.appendChild(el('b', null, 'AT'));
    brand.appendChild(name);
    brand.appendChild(el('span', 'flag'));
    spec.appendChild(brand);

    var big = el('p', 'big');
    big.appendChild(document.createTextNode('Kontrollverlust '));
    big.appendChild(el('em', null, 'verhindern.'));
    spec.appendChild(big);

    spec.appendChild(el('p', 'lead', 'KI-Konzerne liefern sich ein Wettrennen um immer mächtigere Systeme, die niemand mehr sicher kontrollieren kann. Wir setzen uns für eine internationale Pause ein, bis das anders ist.'));
    spec.appendChild(el('p', 'display', 'Die Labore rennen. Die Regeln fehlen.'));
    host.appendChild(spec);
  });
})();
</script>
</body>
</html>
